server:
  port: ${PASS_PORT:18084}

spring:
  application:
    name: pass-service
  datasource:
    url: ${PASS_DB_URL:jdbc:mysql://127.0.0.1:3306/parking_pass?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${PASS_DB_USER:root}
    password: ${PASS_DB_PASSWORD:}
  sql:
    init:
      mode: always
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

management:
  endpoints:
    web:
      exposure:
        include: health,info

space-service:
  url: ${SPACE_SERVICE_URL:http://localhost:18081}

pass:
  reservation:
    prepaid-cents: ${RESERVATION_PREPAID_CENTS:500}
    payment-hold-minutes: ${RESERVATION_PAYMENT_HOLD_MINUTES:15}
  monthly:
    duration-days: ${MONTHLY_PASS_DURATION_DAYS:30}
    initial-balance-cents: ${MONTHLY_PASS_INITIAL_BALANCE_CENTS:20000}
