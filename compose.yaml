name: umlwork

x-java-common: &java-common
  restart: unless-stopped
  environment: &java-env
    NACOS_ENABLED: "true"
    NACOS_SERVER_ADDR: nacos:8848
    JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m}
  depends_on: &java-deps
    mysql:
      condition: service_healthy
    nacos:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/00-create-databases.sql:/docker-entrypoint-initdb.d/00-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -uroot --password=\"$$MYSQL_ROOT_PASSWORD\" parking_analytics -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  nacos:
    image: nacos/nacos-server:v3.1.1
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?Set NACOS_AUTH_TOKEN in .env}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?Set NACOS_AUTH_IDENTITY_KEY in .env}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?Set NACOS_AUTH_IDENTITY_VALUE in .env}
      JVM_XMS: 256m
      JVM_XMX: 768m
      JVM_XMN: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "8080:8080"
    volumes:
      - nacos_data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  space-service:
    <<: *java-common
    build:
      context: .
      args: { MODULE: space-service }
    environment:
      <<: *java-env
      SPACE_DB_URL: jdbc:mysql://mysql:3306/parking_space?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPACE_DB_USER: root
      SPACE_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  access-service:
    <<: *java-common
    build:
      context: .
      args: { MODULE: access-service }
    environment:
      <<: *java-env
      ACCESS_DB_URL: jdbc:mysql://mysql:3306/parking_access?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      ACCESS_DB_USER: root
      ACCESS_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      SPACE_SERVICE_URL: ""
      BILLING_SERVICE_URL: ""
      PASS_SERVICE_URL: ""
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  billing-service:
    <<: *java-common
    build:
      context: .
      args: { MODULE: billing-service }
    environment:
      <<: *java-env
      BILLING_DB_URL: jdbc:mysql://mysql:3306/parking_billing?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      BILLING_DB_USER: root
      BILLING_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  pass-service:
    <<: *java-common
    build:
      context: .
      args: { MODULE: pass-service }
    environment:
      <<: *java-env
      PASS_DB_URL: jdbc:mysql://mysql:3306/parking_pass?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      PASS_DB_USER: root
      PASS_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      SPACE_SERVICE_URL: ""
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  analytics-service:
    <<: *java-common
    build:
      context: .
      args: { MODULE: analytics-service }
    environment:
      <<: *java-env
      ANALYTICS_DB_URL: jdbc:mysql://mysql:3306/parking_analytics?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      ANALYTICS_DB_USER: root
      ANALYTICS_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      ACCESS_SERVICE_URL: ""
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    depends_on:
      <<: *java-deps
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  gateway:
    <<: *java-common
    build:
      context: .
      args: { MODULE: gateway }
    environment:
      <<: *java-env
      SPRING_PROFILES_ACTIVE: nacos
    depends_on:
      space-service: { condition: service_healthy }
      access-service: { condition: service_healthy }
      billing-service: { condition: service_healthy }
      pass-service: { condition: service_healthy }
      analytics-service: { condition: service_healthy }
    ports:
      - "18080:18080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      gateway: { condition: service_healthy }
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q '<html'"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  mysql_data:
  redis_data:
  nacos_data:
