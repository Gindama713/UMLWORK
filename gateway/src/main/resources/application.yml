server:
  port: ${GATEWAY_PORT:18080}

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    gateway:
      server:
        webflux:
          routes:
            - id: spaces
              uri: ${SPACE_SERVICE_URI:http://localhost:18081}
              predicates:
                - Path=/api/v1/spaces/**
            - id: access
              uri: ${ACCESS_SERVICE_URI:http://localhost:18082}
              predicates:
                - Path=/api/v1/access/**
            - id: billing
              uri: ${BILLING_SERVICE_URI:http://localhost:18083}
              predicates:
                - Path=/api/v1/billing/**
            - id: passes
              uri: ${PASS_SERVICE_URI:http://localhost:18084}
              predicates:
                - Path=/api/v1/passes/**
            - id: analytics
              uri: ${ANALYTICS_SERVICE_URI:http://localhost:18085}
              predicates:
                - Path=/api/v1/analytics/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
