server:
  port: ${ACCESS_PORT:18082}

spring:
  application:
    name: access-service
  datasource:
    url: ${ACCESS_DB_URL:jdbc:mysql://localhost:3306/parking_access?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${ACCESS_DB_USER:root}
    password: ${ACCESS_DB_PASSWORD:}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: ${PLATE_IMAGE_MAX_SIZE:3MB}
      max-request-size: ${PLATE_REQUEST_MAX_SIZE:4MB}
  cloud:
    nacos:
      config:
        enabled: false
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        import-check:
          enabled: false
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000

clients:
  space:
    url: ${SPACE_SERVICE_URL:http://localhost:18081}
  billing:
    url: ${BILLING_SERVICE_URL:http://localhost:18083}
  pass:
    url: ${PASS_SERVICE_URL:http://localhost:18084}

plate-recognition:
  enabled: ${PLATE_RECOGNITION_ENABLED:false}
  url: ${PLATE_RECOGNITION_URL:https://api.deepseek.com/chat/completions}
  model: ${PLATE_RECOGNITION_MODEL:deepseek-flash}
  api-key: ${DEEPSEEK_API_KEY:}
  max-bytes: ${PLATE_RECOGNITION_MAX_BYTES:3145728}
  timeout-seconds: ${PLATE_RECOGNITION_TIMEOUT_SECONDS:15}

travel-advice:
  enabled: ${TRAVEL_ADVICE_ENABLED:false}
  url: ${TRAVEL_ADVICE_URL:https://api.deepseek.com/chat/completions}
  model: ${TRAVEL_ADVICE_MODEL:deepseek-flash}
  api-key: ${DEEPSEEK_API_KEY:}
  timeout-seconds: ${TRAVEL_ADVICE_TIMEOUT_SECONDS:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info
