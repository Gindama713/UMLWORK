server:
  port: ${ACCESS_PORT:18082}

spring:
  application:
    name: access-service
  config:
    import: optional:nacos:access-service.properties
  datasource:
    url: ${ACCESS_DB_URL:jdbc:mysql://localhost:3306/parking_access?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${ACCESS_DB_USER:root}
    password: ${ACCESS_DB_PASSWORD:}
  sql:
    init:
      mode: always
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000

clients:
  space:
    url: ${SPACE_SERVICE_URL:http://localhost:18081}
  billing:
    url: ${BILLING_SERVICE_URL:http://localhost:18083}
  pass:
    url: ${PASS_SERVICE_URL:http://localhost:18084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
