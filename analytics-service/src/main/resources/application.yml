server:
  port: ${ANALYTICS_PORT:18085}

spring:
  application:
    name: analytics-service
  datasource:
    url: ${ANALYTICS_DB_URL:jdbc:mysql://localhost:3306/parking_analytics?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${ANALYTICS_DB_USER:root}
    password: ${ANALYTICS_DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
      timeout: ${REDIS_TIMEOUT:500ms}
  sql:
    init:
      mode: always
  cloud:
    nacos:
      config:
        enabled: false
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        import-check:
          enabled: false
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000

clients:
  access:
    url: ${ACCESS_SERVICE_URL:http://localhost:18082}

parking:
  analytics:
    redis:
      ttl: ${ANALYTICS_REDIS_TTL:PT1H}
    ai:
      enabled: ${ANALYTICS_AI_ENABLED:false}
      url: ${ANALYTICS_AI_URL:https://api.deepseek.com/chat/completions}
      model: ${ANALYTICS_AI_MODEL:deepseek-flash}
      api-key: ${DEEPSEEK_API_KEY:}
      timeout-seconds: ${ANALYTICS_AI_TIMEOUT_SECONDS:15}

management:
  health:
    redis:
      enabled: false # Redis is an optional read cache; MySQL remains authoritative.
  endpoints:
    web:
      exposure:
        include: health,info
